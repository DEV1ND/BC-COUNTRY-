name: Quantum BPE fragmentation diagnostics

on:
  pull_request:
    paths:
      - "quantum_bpe_diagnostics.py"
      - "test_quantum_bpe_diagnostics.py"
      - "bpe_tokenizer.py"
      - ".github/workflows/quantum-bpe-diagnostics.yml"
  push:
    branches:
      - quantum-candidate-bpe-fragmentation-diagnostics
    paths:
      - "quantum_bpe_diagnostics.py"
      - "test_quantum_bpe_diagnostics.py"
      - "bpe_tokenizer.py"
      - ".github/workflows/quantum-bpe-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile diagnostics
        run: python -m py_compile quantum_bpe_diagnostics.py test_quantum_bpe_diagnostics.py bpe_tokenizer.py
      - name: Run unit tests
        run: python -m unittest -v test_quantum_bpe_diagnostics.py
