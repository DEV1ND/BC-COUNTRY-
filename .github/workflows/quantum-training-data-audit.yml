name: Quantum Candidate training data inventory audit

on:
  push:
    branches:
      - quantum-candidate-training-data-audit
    paths:
      - "training_extra.json"
      - "quantum_training_data_audit.py"
      - "test_quantum_training_data_audit.py"
      - ".github/workflows/quantum-training-data-audit.yml"
  pull_request:
    branches:
      - quantum-candidate-tokenizer-provenance-gate
      - quantum-candidate-training-data-audit
    paths:
      - "training_extra.json"
      - "quantum_training_data_audit.py"
      - "test_quantum_training_data_audit.py"
      - ".github/workflows/quantum-training-data-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile inventory audit
        run: python -m py_compile quantum_training_data_audit.py test_quantum_training_data_audit.py
      - name: Run inventory audit tests
        run: python -m unittest -v test_quantum_training_data_audit
      - name: Audit current dataset without printing content
        run: |
          python quantum_training_data_audit.py --input training_extra.json --output "$RUNNER_TEMP/quantum_training_data_audit.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "quantum_training_data_audit.json").read_text(encoding="utf-8"))
          assert report["records_total"] > 0
          assert report["training_release_eligible"] is False
          assert report["report_contains_raw_question_or_answer_text"] is False
          print(json.dumps({
              "records_total": report["records_total"],
              "approved_true_records": report["approved_true_records"],
              "valid_question_answer_records": report["valid_question_answer_records"],
              "invalid_question_answer_records": report["invalid_question_answer_records"],
              "duplicate_question_answer_rows_beyond_first": report["duplicate_question_answer_rows_beyond_first"],
              "question_groups_with_conflicting_answers": report["question_groups_with_conflicting_answers"],
              "source_label_distribution": report["source_label_distribution"],
              "missing_provenance_field_counts": report["missing_provenance_field_counts"],
              "potential_email_pattern_rows": report["potential_email_pattern_rows"],
              "potential_korean_mobile_pattern_rows": report["potential_korean_mobile_pattern_rows"],
              "training_release_eligible": report["training_release_eligible"]
          }, ensure_ascii=False))
          PY
