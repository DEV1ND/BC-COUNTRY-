name: Quantum Candidate retrieval experiment isolation

on:
  push:
    branches: [quantum-candidate-retrieval-experiments]
    paths:
      - "quantum-inference/experimental_retrieval.py"
      - "quantum-inference/app.py"
      - "quantum-inference/inference_metrics.py"
      - "quantum-inference/tests/test_inference_metrics.py"
      - "quantum-inference/benchmark_experimental_retrieval.py"
      - "quantum-inference/tests/test_experimental_retrieval.py"
      - "quantum-inference/tests/test_experimental_benchmark.py"
      - ".github/workflows/quantum-candidate-retrieval-experiments.yml"
  pull_request:
    branches: [quantum-candidate-security-hardening]
    paths:
      - "quantum-inference/experimental_retrieval.py"
      - "quantum-inference/app.py"
      - "quantum-inference/inference_metrics.py"
      - "quantum-inference/tests/test_inference_metrics.py"
      - "quantum-inference/benchmark_experimental_retrieval.py"
      - "quantum-inference/tests/test_experimental_retrieval.py"
      - "quantum-inference/tests/test_experimental_benchmark.py"
      - ".github/workflows/quantum-candidate-retrieval-experiments.yml"

permissions:
  contents: read

jobs:
  isolated-retrieval-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile experiment modules
        run: |
          python -m py_compile quantum-inference/experimental_retrieval.py
          python -m py_compile quantum-inference/app.py
          python -m py_compile quantum-inference/inference_metrics.py
          python -m py_compile quantum-inference/tests/test_inference_metrics.py
          python -m py_compile quantum-inference/benchmark_experimental_retrieval.py
          python -m py_compile quantum-inference/tests/test_experimental_retrieval.py
          python -m py_compile quantum-inference/tests/test_experimental_benchmark.py
      - name: Run isolated retrieval tests
        working-directory: quantum-inference
        run: |
          python -m unittest discover -s tests -p "test_experimental_retrieval.py" -v
          python -m unittest discover -s tests -p "test_inference_metrics.py" -v
          python -m unittest discover -s tests -p "test_experimental_benchmark.py" -v
