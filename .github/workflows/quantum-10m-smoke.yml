name: JUCKEX Quantum 10M extended training experiment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 KST, weekly bounded run
  push:
    branches: [main]
    paths:
      - 'quantum_10m_config.json'
      - 'training_extra.json'
      - 'bpe_candidate_train.py'
      - 'quantum_feedback_approved.json'
      - 'quantum_self_improve.py'
      - 'quantum_r2_checkpoint.py'
      - 'quantum_storage_requirements.txt'
      - 'bpe_independent_eval.json'
      - 'test_quality_benchmark.py'
      - 'quantum_retrieval.py'
      - 'test_quantum_retrieval.py'
      - 'test_quantum_self_improve.py'
      - '.github/workflows/quantum-10m-smoke.yml'

permissions:
  contents: read

env:
  QUANTUM_R2_ACCOUNT_ID: ${{ secrets.QUANTUM_R2_ACCOUNT_ID }}
  QUANTUM_R2_ACCESS_KEY_ID: ${{ secrets.QUANTUM_R2_ACCESS_KEY_ID }}
  QUANTUM_R2_SECRET_ACCESS_KEY: ${{ secrets.QUANTUM_R2_SECRET_ACCESS_KEY }}
  QUANTUM_R2_BUCKET: ${{ secrets.QUANTUM_R2_BUCKET }}
  QUANTUM_R2_CONFIGURED: ${{ secrets.QUANTUM_R2_ACCOUNT_ID != '' && secrets.QUANTUM_R2_ACCESS_KEY_ID != '' && secrets.QUANTUM_R2_SECRET_ACCESS_KEY != '' && secrets.QUANTUM_R2_BUCKET != '' }}

concurrency:
  group: juckex-quantum-10m-smoke
  cancel-in-progress: false

jobs:
  architecture-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU training dependencies
        run: pip install -r requirements.txt

      - name: Install optional private R2 checkpoint client
        if: ${{ env.QUANTUM_R2_CONFIGURED == 'true' }}
        run: pip install -r quantum_storage_requirements.txt

      - name: Restore previous Candidate from private R2
        if: ${{ env.QUANTUM_R2_CONFIGURED == 'true' }}
        run: python quantum_r2_checkpoint.py download --state-dir "${{ runner.temp }}/quantum-candidate-state"

      - name: Run regression tests
        run: python -m unittest test_quality_benchmark.py test_quantum_retrieval.py test_quantum_self_improve.py

      - name: Verify and smoke-train Quantum 10M
        env:
          QUANTUM_CANDIDATE_STATE_DIR: ${{ env.QUANTUM_R2_CONFIGURED == 'true' && format('{0}/quantum-candidate-state', runner.temp) || '' }}
        run: |
          python quantum_self_improve.py --steps 500 --vocab-size 1024 --seed 20261125
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("bpe_candidate_report.json").read_text(encoding="utf-8"))
          count = report["candidate_parameters"]
          assert 9_800_000 <= count <= 10_200_000, count
          assert report["live_model_changed"] is False
          print(json.dumps({
              "architecture": report["architecture"],
              "parameters": count,
              "status": "extended_training_experiment",
              "promotion": "not_promoted",
              "live_model_changed": False
          }, ensure_ascii=False, indent=2))
          PY

      - name: Persist latest Candidate to private R2
        if: ${{ env.QUANTUM_R2_CONFIGURED == 'true' }}
        run: python quantum_r2_checkpoint.py upload --state-dir "${{ runner.temp }}/quantum-candidate-state"

      # This repository is public. Never attach model weights to its workflow artifacts.
      # Keep only non-weight experiment metadata here until a private checkpoint store is verified.
      - name: Upload experiment reports only (no model checkpoint)
        uses: actions/upload-artifact@v4
        with:
          name: juckex-quantum-10m-report
          path: |
            bpe_candidate_report.json
            bpe_candidate.json
            bpe_generation_seed_*.json
            quantum_self_improvement_report.json
            quantum_review_queue.json
            quantum_reflection_review_queue.json
            quantum_probe_answers.json
            quantum_self_reflection.json
            quantum_next_cycle_probes.json
          if-no-files-found: error
          retention-days: 14
