name: Quantum Candidate knowledge retrieval safety

on:
  push:
    branches:
      - quantum-candidate-security-hardening
    paths:
      - "quantum-inference/knowledge_retrieval.py"
      - "quantum-inference/app.py"
      - "quantum-inference/knowledge_provenance.py"
      - "quantum-inference/generation_sources.py"
      - "quantum-inference/tests/test_knowledge_retrieval.py"
      - "quantum-inference/tests/test_knowledge_provenance.py"
      - "quantum-inference/tests/test_generation_sources.py"
      - ".github/workflows/quantum-candidate-knowledge-retrieval.yml"
  pull_request:
    branches:
      - quantum-candidate-security-hardening
    paths:
      - "quantum-inference/knowledge_retrieval.py"
      - "quantum-inference/app.py"
      - "quantum-inference/tests/test_knowledge_retrieval.py"
      - ".github/workflows/quantum-candidate-knowledge-retrieval.yml"

permissions:
  contents: read

jobs:
  candidate-knowledge-retrieval:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Candidate source only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile retrieval and inference modules
        run: |
          python -m py_compile quantum-inference/knowledge_retrieval.py
          python -m py_compile quantum-inference/app.py
          python -m py_compile quantum-inference/knowledge_provenance.py
          python -m py_compile quantum-inference/generation_sources.py
          python -m py_compile quantum-inference/tests/test_knowledge_retrieval.py
          python -m py_compile quantum-inference/tests/test_knowledge_provenance.py
          python -m py_compile quantum-inference/tests/test_generation_sources.py
      - name: Run knowledge retrieval and failure-isolation tests
        run: |
          python -m unittest discover \
            -s quantum-inference/tests \
            -p "test_*.py" \
            -v
