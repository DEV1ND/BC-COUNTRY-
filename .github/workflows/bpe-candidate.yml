name: JUCKEX BPE candidate evaluation

on:
  push:
    branches: [main]
    paths:
      - "bpe_candidate_train.py"
      - "bpe_tokenizer.py"
      - "training_extra.json"

permissions:
  contents: write

concurrency:
  group: juckex-bpe-candidate
  cancel-in-progress: false

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU training dependencies
        run: pip install -r requirements.txt

      - name: Train isolated candidate and compare on held-out split
        run: python bpe_candidate_train.py --steps 1000 --vocab-size 1024 --seed 20261120

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: juckex-bpe-candidate
          path: |
            bpe_candidate_report.json
            bpe_candidate.json
            bpe_candidate_checkpoint.pt
          if-no-files-found: error
          retention-days: 14

      - name: Publish read-only benchmark report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bpe_candidate_report.json bpe_candidate.json
          if git diff --cached --quiet; then
            echo "No benchmark report changes to publish"
          else
            git commit -m "Publish isolated BPE candidate evaluation report"
            git push
          fi
