name: JUCKEX BPE candidate evaluation

on:
  push:
    branches: [main]
    paths:
      - "bpe_candidate_train.py"
      - "bpe_tokenizer.py"
      - "training_extra.json"
      - "bpe_independent_eval.json"
      - "test_quality_benchmark.py"
      - ".github/workflows/bpe-candidate.yml"

permissions:
  contents: write

concurrency:
  group: juckex-bpe-candidate
  cancel-in-progress: false

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU training dependencies
        run: pip install -r requirements.txt

      - name: Run retrieval and tokenizer regression tests
        run: python -m unittest test_quality_benchmark.py

      - name: Train isolated candidates with three independent seeds
        shell: bash
        run: |
          set -euo pipefail
          for seed in 20261120 20261121 20261122; do
            echo "Training isolated candidate with seed=$seed"
            python bpe_candidate_train.py --steps 1000 --vocab-size 1024 --seed "$seed"
            cp bpe_candidate_report.json "bpe_candidate_report_seed_${seed}.json"
          done

      - name: Aggregate multi-seed evaluation
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          seeds = [20261120, 20261121, 20261122]
          reports = [json.loads(Path(f"bpe_candidate_report_seed_{seed}.json").read_text(encoding="utf-8")) for seed in seeds]
          scores = [r["bpe_candidate_bits_per_character"] for r in reports]
          baseline = [r["live_char_model_bits_per_character"] for r in reports]
          independent = [r["independent_bpe_bits_per_character"] for r in reports]
          independent_baseline = [r["independent_live_char_bits_per_character"] for r in reports]
          mean = sum(scores) / len(scores)
          variance = sum((x - mean) ** 2 for x in scores) / len(scores)
          result = {
              "status": "evaluated_not_promoted",
              "evaluation": "three_seed_repeatability_on_same_deterministic_validation_split",
              "live_model_changed": False,
              "seeds": seeds,
              "runs": reports,
              "bpe_bpc_mean": round(mean, 6),
              "bpe_bpc_population_stddev": round(math.sqrt(variance), 6),
              "char_baseline_bpc_mean": round(sum(baseline) / len(baseline), 6),
              "all_runs_bpe_better_on_validation": all(r["candidate_better_on_this_split"] for r in reports),
              "independent_bpe_bpc_mean": round(sum(independent) / len(independent), 6),
              "independent_bpe_bpc_population_stddev": round((sum((x - sum(independent)/len(independent))**2 for x in independent)/len(independent))**0.5, 6),
              "independent_char_baseline_bpc_mean": round(sum(independent_baseline) / len(independent_baseline), 6),
              "all_runs_bpe_better_on_independent_set": all(r["candidate_better_on_independent_set"] for r in reports),
              "promotion": "보류: 세 seed는 재현성 점검일 뿐이며 독립 외부 테스트와 실제 답변 생성 평가가 추가로 필요합니다."
          }
          Path("bpe_seed_sweep_report.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({k:v for k,v in result.items() if k != "runs"}, ensure_ascii=False, indent=2))
          PY

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: juckex-bpe-three-seed-candidates
          path: |
            bpe_candidate_report.json
            bpe_candidate_report_seed_*.json
            bpe_seed_sweep_report.json
            bpe_candidate.json
            bpe_candidate_checkpoint.pt
          if-no-files-found: error
          retention-days: 14

      - name: Publish read-only benchmark reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bpe_candidate_report.json bpe_candidate.json bpe_candidate_report_seed_*.json bpe_seed_sweep_report.json
          if git diff --cached --quiet; then
            echo "No benchmark report changes to publish"
          else
            git commit -m "Publish three-seed BPE candidate evaluation"
            git push
          fi
