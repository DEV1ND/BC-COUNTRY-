name: Quantum Candidate review attestation verifier

on:
  push:
    branches:
      - quantum-candidate-review-attestation-verifier
      - quantum-candidate-review-attestation-issuer
      - quantum-candidate-review-attestation-worker-routes
      - quantum-candidate-review-attestation-python-client
    paths:
      - "quantum_review_attestation.py"
      - "test_quantum_review_attestation.py"
      - "quantum_human_review.py"
      - "quantum_review_attestation_client.py"
      - "test_quantum_review_attestation_client.py"
      - "test_quantum_human_review.py"
      - "cloudflare-workers/review_attestation.mjs"
      - "cloudflare-workers/tests/review-attestation.test.mjs"
      - "cloudflare-workers/tests/review-attestation-routes.test.mjs"
      - "cloudflare-workers/juckex-quantum-wikipedia-explorer.mjs"
      - ".github/workflows/quantum-review-attestation.yml"
  pull_request:
    branches:
      - quantum-candidate-human-review-identity-gate
      - quantum-candidate-review-attestation-verifier
      - quantum-candidate-review-attestation-issuer
      - quantum-candidate-review-attestation-replay-guard
      - quantum-candidate-review-attestation-worker-routes
    paths:
      - "quantum_review_attestation.py"
      - "test_quantum_review_attestation.py"
      - "quantum_human_review.py"
      - "test_quantum_human_review.py"
      - "QUANTUM_REVIEW_ATTESTATION.md"
      - "cloudflare-workers/review_attestation.mjs"
      - "cloudflare-workers/tests/review-attestation.test.mjs"
      - "cloudflare-workers/tests/review-attestation-routes.test.mjs"
      - "cloudflare-workers/juckex-quantum-wikipedia-explorer.mjs"
      - ".github/workflows/quantum-review-attestation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Candidate review modules
        run: python -m py_compile quantum_review_attestation.py quantum_human_review.py quantum_review_attestation_client.py
      - name: Run signed-attestation and human-review tests
        run: python -m unittest -v test_quantum_review_attestation test_quantum_human_review test_quantum_review_attestation_client
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Cloudflare Worker attestation signer
        run: node --test cloudflare-workers/tests/review-attestation.test.mjs cloudflare-workers/tests/review-attestation-routes.test.mjs
