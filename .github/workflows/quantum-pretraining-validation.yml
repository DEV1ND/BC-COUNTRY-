name: Quantum pretraining pipeline validation

on:
  push:
    branches:
      - quantum-pretraining-10k
    paths:
      - "pretraining/**"
      - ".github/workflows/quantum-pretraining-validation.yml"
  pull_request:
    branches:
      - quantum-live-inference
    paths:
      - "pretraining/**"
      - ".github/workflows/quantum-pretraining-validation.yml"

jobs:
  syntax-and-manifest-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile training pipeline
        run: python -m py_compile pretraining/train.py pretraining/prepare_corpus.py pretraining/prepare_wikimedia_dump.py pretraining/audit_corpus.py
      - name: Validate manifest example JSONL shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("pretraining/manifest.example.jsonl")
          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          required = {"path", "source_name", "source_url", "retrieved_at", "license_id", "license_url", "attribution", "split", "review_status"}
          assert len(rows) == 2
          assert all(required <= row.keys() for row in rows)
          assert {row["split"] for row in rows} == {"train", "validation"}
          print("manifest example structure: PASS")
          PY

      - name: Verify corpus audit CLI is available
        run: python pretraining/audit_corpus.py --help
