name: Quantum self-improvement safety tests

on:
  push:
    branches: [quantum-candidate-autonomous-diagnostics]
    paths:
      - 'quantum_self_improve.py'
      - 'test_quantum_self_improve.py'
      - 'quantum_dataset_audit.py'
      - 'test_quantum_dataset_audit.py'
      - 'quantum_training_data.py'
      - 'test_quantum_training_data.py'
      - 'quantum_eval_candidate_queue.json'
      - 'test_quantum_eval_candidate_queue.py'
      - 'quantum_eval_review.py'
      - 'test_quantum_eval_review.py'
      - 'quantum_feedback_approved.json'
      - 'bpe_candidate_train.py'
      - 'test_bpe_tokenizer.py'
      - 'bpe_tokenizer.py'
      - 'bpe_independent_eval.json'
      - '.github/workflows/quantum-self-improve-tests.yml'
      - '.github/workflows/quantum-10m-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'quantum_self_improve.py'
      - 'test_quantum_self_improve.py'
      - 'quantum_dataset_audit.py'
      - 'test_quantum_dataset_audit.py'
      - 'quantum_training_data.py'
      - 'test_quantum_training_data.py'
      - 'quantum_eval_candidate_queue.json'
      - 'test_quantum_eval_candidate_queue.py'
      - 'quantum_feedback_approved.json'
      - 'bpe_candidate_train.py'
      - 'bpe_tokenizer.py'
      - 'test_bpe_tokenizer.py'
      - 'bpe_independent_eval.json'
      - 'QUANTUM_SELF_IMPROVEMENT.md'
      - '.github/workflows/quantum-self-improve-tests.yml'
      - '.github/workflows/quantum-10m-smoke.yml'

permissions:
  contents: read

jobs:
  self-improve-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile self-improvement and training modules
        run: python -m py_compile quantum_self_improve.py quantum_dataset_audit.py quantum_eval_review.py bpe_candidate_train.py bpe_tokenizer.py quantum_training_data.py
      - name: Audit training and evaluation datasets
        run: python quantum_dataset_audit.py
      - name: Test self-play, data integrity and pending evaluation queue
        run: python -m unittest test_quantum_self_improve.py test_quantum_dataset_audit.py test_quantum_training_data.py test_quantum_eval_candidate_queue.py test_quantum_eval_review.py test_bpe_tokenizer.py
