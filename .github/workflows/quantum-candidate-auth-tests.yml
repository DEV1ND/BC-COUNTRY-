name: Quantum Candidate Auth Tests

on:
  pull_request:
    branches:
      - quantum-data-repair
      - quantum-candidate-security-hardening
      - quantum-candidate-r2-storage
    paths:
      - "quantum-inference/**"
      - ".github/workflows/quantum-candidate-auth-tests.yml"
  push:
    branches:
      - quantum-candidate-security-hardening
      - quantum-candidate-r2-storage
    paths:
      - "quantum-inference/**"
      - ".github/workflows/quantum-candidate-auth-tests.yml"

jobs:
  auth-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile candidate Python sources
        run: python -m compileall -q .
      - name: Run candidate security and storage tests
        run: python -m unittest -v test_auth_policy.py test_checkpoint_storage.py
