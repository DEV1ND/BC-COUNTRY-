name: Quantum Answer Engine Tests

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/quantum-answer-engine-tests.yml"
  push:
    branches:
      - quantum-answer-engine-isolated

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run answer engine tests
        run: node --test runtime/quantum-answer-engine.test.mjs
