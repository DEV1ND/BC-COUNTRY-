name: Quantum Candidate knowledge and Wikipedia tests

on:
  push:
    branches:
      - quantum-candidate-security-hardening
    paths:
      - "quantum-inference/wikipedia_seed.py"
      - "quantum-inference/app.py"
      - "quantum-inference/tests/test_model_metadata.py"
      - "quantum-inference/model_metadata.py"
      - "quantum-inference/tests/test_run_generation_benchmark.py"
      - "quantum-inference/run_generation_benchmark.py"
      - "quantum-inference/tests/test_retrieval_benchmark.py"
      - "quantum-inference/evaluation/knowledge_retrieval_cases.json"
      - "quantum-inference/retrieval_benchmark.py"
      - "quantum-inference/knowledge_retrieval.py"
      - "quantum-inference/generation_sources.py"
      - "quantum-inference/knowledge_provenance.py"
      - "quantum-inference/knowledge_index_status.py"
      - "quantum-inference/seed_quality.py"
      - "quantum-inference/tests/test_seed_quality.py"
      - "quantum-inference/tests/test_seed_policy.py"
      - "quantum-inference/tests/test_knowledge_provenance.py"
      - "quantum-inference/tests/test_knowledge_index_status.py"
      - "quantum-inference/tests/test_wikipedia_seed.py"
      - "quantum-inference/tests/test_knowledge_retrieval.py"
      - "quantum-inference/tests/test_generation_sources.py"
      - "cloudflare-workers/**"
      - ".github/workflows/quantum-wikipedia-seed-candidate.yml"
  pull_request:
    branches:
      - quantum-candidate-security-hardening
    paths:
      - "quantum-inference/tests/test_model_metadata.py"
      - "quantum-inference/model_metadata.py"
      - "quantum-inference/tests/test_run_generation_benchmark.py"
      - "quantum-inference/run_generation_benchmark.py"
      - "quantum-inference/app.py"
      - "quantum-inference/retrieval_benchmark.py"
      - "quantum-inference/evaluation/knowledge_retrieval_cases.json"
      - "quantum-inference/tests/test_retrieval_benchmark.py"
      - "quantum-inference/wikipedia_seed.py"
      - "quantum-inference/app.py"
      - "quantum-inference/knowledge_retrieval.py"
      - "quantum-inference/generation_sources.py"
      - "quantum-inference/knowledge_provenance.py"
      - "quantum-inference/knowledge_index_status.py"
      - "quantum-inference/seed_quality.py"
      - "quantum-inference/tests/test_knowledge_provenance.py"
      - "quantum-inference/tests/test_knowledge_index_status.py"
      - "quantum-inference/tests/test_seed_quality.py"
      - "quantum-inference/tests/test_wikipedia_seed.py"
      - "quantum-inference/tests/test_knowledge_retrieval.py"
      - "quantum-inference/tests/test_generation_sources.py"
      - ".github/workflows/quantum-wikipedia-seed-candidate.yml"
      - "cloudflare-workers/**"

permissions:
  contents: read

jobs:
  knowledge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile knowledge modules and tests
        run: |
          python -m py_compile quantum-inference/wikipedia_seed.py
          python -m py_compile quantum-inference/app.py
          python -m py_compile quantum-inference/run_generation_benchmark.py
          python -m py_compile quantum-inference/tests/test_run_generation_benchmark.py
          python -m py_compile quantum-inference/model_metadata.py
          python -m py_compile quantum-inference/tests/test_model_metadata.py
          python -m py_compile quantum-inference/retrieval_benchmark.py
          python -m py_compile quantum-inference/tests/test_retrieval_benchmark.py
          python -m py_compile quantum-inference/knowledge_retrieval.py
          python -m py_compile quantum-inference/generation_sources.py
          python -m py_compile quantum-inference/knowledge_provenance.py
          python -m py_compile quantum-inference/knowledge_index_status.py
          python -m py_compile quantum-inference/seed_quality.py
          python -m py_compile quantum-inference/tests/test_seed_quality.py
          python -m py_compile quantum-inference/tests/test_seed_policy.py
          python -m py_compile quantum-inference/tests/test_knowledge_provenance.py
          python -m py_compile quantum-inference/tests/test_knowledge_index_status.py
          python -m py_compile quantum-inference/tests/test_wikipedia_seed.py
          python -m py_compile quantum-inference/tests/test_knowledge_retrieval.py
          python -m py_compile quantum-inference/tests/test_generation_sources.py
      - name: Check Cloudflare Worker and run sync safety tests
        run: |
          node --check cloudflare-workers/juckex-quantum-wikipedia-explorer.mjs
          node --check cloudflare-workers/knowledge_sync_plan.mjs
          node --test cloudflare-workers/tests/*.test.mjs
      - name: Run isolated knowledge and retrieval tests
        run: |
          cd quantum-inference
          python -m unittest tests.test_wikipedia_seed tests.test_knowledge_retrieval tests.test_generation_sources tests.test_retrieval_benchmark tests.test_knowledge_provenance tests.test_knowledge_index_status tests.test_seed_quality tests.test_seed_policy tests.test_run_generation_benchmark tests.test_model_metadata -v
