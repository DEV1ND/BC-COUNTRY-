name: Quantum Candidate Wikipedia seed tests

on:
  push:
    branches:
      - quantum-candidate-security-hardening
    paths:
      - "quantum-inference/wikipedia_seed.py"
      - "quantum-inference/tests/test_wikipedia_seed.py"
      - ".github/workflows/quantum-wikipedia-seed-candidate.yml"
  pull_request:
    branches:
      - quantum-candidate-security-hardening
    paths:
      - "quantum-inference/wikipedia_seed.py"
      - "quantum-inference/tests/test_wikipedia_seed.py"
      - ".github/workflows/quantum-wikipedia-seed-candidate.yml"

permissions:
  contents: read

jobs:
  seed-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile seed module and tests
        run: |
          python -m py_compile quantum-inference/wikipedia_seed.py
          python -m py_compile quantum-inference/tests/test_wikipedia_seed.py
      - name: Run isolated Wikipedia seed tests
        run: |
          cd quantum-inference
          python -m unittest tests.test_wikipedia_seed -v
