name: Quantum Candidate knowledge and Wikipedia tests

on:
  push:
    branches:
      - quantum-candidate-security-hardening
    paths:
      - "quantum-inference/wikipedia_seed.py"
      - "quantum-inference/knowledge_retrieval.py"
      - "quantum-inference/generation_sources.py"
      - "quantum-inference/tests/test_wikipedia_seed.py"
      - "quantum-inference/tests/test_knowledge_retrieval.py"
      - "quantum-inference/tests/test_generation_sources.py"
      - ".github/workflows/quantum-wikipedia-seed-candidate.yml"
  pull_request:
    branches:
      - quantum-candidate-security-hardening
    paths:
      - "quantum-inference/wikipedia_seed.py"
      - "quantum-inference/knowledge_retrieval.py"
      - "quantum-inference/generation_sources.py"
      - "quantum-inference/tests/test_wikipedia_seed.py"
      - "quantum-inference/tests/test_knowledge_retrieval.py"
      - "quantum-inference/tests/test_generation_sources.py"
      - ".github/workflows/quantum-wikipedia-seed-candidate.yml"

permissions:
  contents: read

jobs:
  knowledge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile knowledge modules and tests
        run: |
          python -m py_compile quantum-inference/wikipedia_seed.py
          python -m py_compile quantum-inference/knowledge_retrieval.py
          python -m py_compile quantum-inference/generation_sources.py
          python -m py_compile quantum-inference/tests/test_wikipedia_seed.py
          python -m py_compile quantum-inference/tests/test_knowledge_retrieval.py
          python -m py_compile quantum-inference/tests/test_generation_sources.py
      - name: Run isolated knowledge and retrieval tests
        run: |
          cd quantum-inference
          python -m unittest tests.test_wikipedia_seed tests.test_knowledge_retrieval tests.test_generation_sources -v
