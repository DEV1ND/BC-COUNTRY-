name: Quantum v2 validation
on:
  push:
    branches: [quantum-v2-development]
  pull_request:
    branches: [quantum-v2-development]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q quantum_data_pipeline.py quantum_build_knowledge_index.py bpe_candidate_train.py quantum-inference
      - name: Run data and retrieval smoke test
        run: python quantum_v2_smoke_test.py
