name: Quantum runtime training provenance guard

on:
  pull_request:
    paths:
      - "app.py"
      - "candidate_checkpoint_contract.py"
      - "test_candidate_checkpoint_contract.py"
      - "test_quantum_benchmark_integrity.py"
      - "quantum-inference/evaluation/benchmark_v1.json"
      - "QUANTUM_CANDIDATE_CHECKPOINT_CONTRACT.md"
      - "runtime_training_provenance_guard.py"
      - "startup_model_restore_guard.py"
      - "test_startup_model_restore_safety.py"
      - "test_runtime_training_provenance_guard.py"
      - "test_training_provenance.py"
      - "test_training_data_quality.py"
      - "training_extra.json"
      - "bpe_independent_eval.json"
      - "training_provenance.py"
      - ".github/workflows/quantum-runtime-training-provenance-guard.yml"
  push:
    branches:
      - quantum-candidate-runtime-training-provenance-guard
    paths:
      - "app.py"
      - "runtime_training_provenance_guard.py"
      - "test_runtime_training_provenance_guard.py"
      - "training_provenance.py"
      - ".github/workflows/quantum-runtime-training-provenance-guard.yml"

permissions:
  contents: read

jobs:
  runtime-training-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile runtime guard
        run: python -m py_compile app.py runtime_training_provenance_guard.py startup_model_restore_guard.py test_startup_model_restore_safety.py test_runtime_training_provenance_guard.py training_provenance.py test_training_provenance.py test_training_data_quality.py candidate_checkpoint_contract.py test_candidate_checkpoint_contract.py test_quantum_benchmark_integrity.py
      - name: Run guard tests
        run: python -m unittest -v test_startup_model_restore_safety.py test_runtime_training_provenance_guard.py test_training_provenance.py test_training_data_quality.py test_candidate_checkpoint_contract.py test_quantum_benchmark_integrity.py
