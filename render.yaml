services:
  - type: web
    name: juckex-inference
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: JUCKEX_WORKER_URL
        value: https://juckex-ai.bcsite.workers.dev
      - key: JUCKEX_SYNC_TOKEN
        sync: false
