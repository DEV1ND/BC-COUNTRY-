name = "juckex-quantum-web-explorer"
main = "worker.js"
compatibility_date = "2026-11-21"
[triggers]
crons = ["*/5 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_NEW_LAB_D1_DATABASE"
database_id = "REPLACE_WITH_NEW_LAB_D1_ID"
[[r2_buckets]]
binding = "RAW_PAGES"
bucket_name = "REPLACE_WITH_NEW_LAB_R2_BUCKET"
[vars]
NAVER_SEARCH_ENDPOINT = "https://openapi.naver.com/v1/search/webkr.json"
# Store credentials with wrangler secret put; never commit API keys.
# Google Custom Search JSON API is for existing customers only.
# New Google integrations need a supported product such as Vertex AI Search.
# Set ADMIN_TOKEN as a secret before deployment.