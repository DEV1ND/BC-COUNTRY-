name = "juckex-quantum-web-explorer"
main = "worker.js"
compatibility_date = "2026-11-21"
[triggers]
crons = ["*/5 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_NEW_LAB_D1_DATABASE"
database_id = "REPLACE_WITH_NEW_LAB_D1_ID"
[[r2_buckets]]
binding = "RAW_PAGES"
bucket_name = "REPLACE_WITH_NEW_LAB_R2_BUCKET"
[vars]
NAVER_HUB_ENDPOINT = "https://naverapihub.apigw.ntruss.com/search/v1/webkr"
# Store credentials with wrangler secret put; never commit API keys.
# NAVER_HUB_KEY_ID and NAVER_HUB_KEY are NAVER API HUB credentials.
# Google Custom Search JSON API is for existing customers only; new Google integration needs a supported product.
# Set ADMIN_TOKEN as a secret before deployment.